name: Docs site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Validate docs contract
        run: sh scripts/check-docs-contract.sh .

      - name: Build docs site
        run: sh scripts/build-docs-site.sh docs-site site

      - name: Configure Pages
        id: configure-pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6.0.0

      - name: Report Pages configuration failure
        if: ${{ failure() && steps.configure-pages.outcome == 'failure' }}
        run: |
          echo "::error::GitHub Pages configuration failed. Verify the repository Pages settings and workflow permissions, then rerun the workflow."

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Report Pages deployment failure
        if: ${{ failure() && steps.deployment.outcome == 'failure' }}
        run: |
          echo "::error::GitHub Pages deployment failed. Verify the Pages environment and deployment permissions, then rerun the workflow."
