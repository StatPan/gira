name: Docs site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs site
        run: sh scripts/build-docs-site.sh docs-site site

      - name: Configure Pages
        id: configure-pages
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0

      - name: Report skipped Pages configuration
        if: github.event_name == 'push' && steps.configure-pages.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository yet. Enable Pages with GitHub Actions as the source, then rerun this workflow."

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.0

      - name: Report skipped Pages deployment setup
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment failed. Enable Pages for this repository in Settings > Pages, then rerun this workflow."
