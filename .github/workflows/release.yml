name: Go release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check install script
        run: sh -n install.sh

      - name: Run Go tests
        run: go test ./...

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          name="gira_${version}_${GOOS}_${GOARCH}"
          out_dir="dist/${name}"
          bin="gira"
          if [ "${GOOS}" = "windows" ]; then
            bin="gira.exe"
          fi

          mkdir -p "${out_dir}" release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${out_dir}/${bin}" ./cmd/gira
          cp README.md "${out_dir}/"

          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist && zip -qr "../release-assets/${name}.zip" "${name}")
          else
            tar -C dist -czf "release-assets/${name}.tar.gz" "${name}"
          fi

      - name: Smoke install script against local archive
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          name="gira_${version}_${GOOS}_${GOARCH}"
          archive="${name}.tar.gz"
          asset_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          cp "release-assets/${archive}" "${asset_dir}/${archive}"
          (cd "${asset_dir}" && sha256sum "${archive}" > checksums.txt)
          GIRA_VERSION="${version}" GIRA_BASE_URL="file://${asset_dir}" GIRA_INSTALL_DIR="${install_dir}" sh install.sh
          "${install_dir}/gira" --help >/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gira-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksum asset
        run: |
          set -euo pipefail
          cd release-assets
          expected_assets=(
            "gira_${GITHUB_REF_NAME}_darwin_amd64.tar.gz"
            "gira_${GITHUB_REF_NAME}_darwin_arm64.tar.gz"
            "gira_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
            "gira_${GITHUB_REF_NAME}_linux_arm64.tar.gz"
            "gira_${GITHUB_REF_NAME}_windows_amd64.zip"
          )
          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done
          actual_count="$(find . -maxdepth 1 -type f ! -name checksums.txt | wc -l | tr -d ' ')"
          test "${actual_count}" = "5"
          sha256sum "${expected_assets[@]}" > checksums.txt
          sha256sum -c checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* --verify-tag --title "${tag}" --generate-notes
          fi
