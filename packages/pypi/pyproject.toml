[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gira-cli"
version = "0.0.0.dev0"
description = "Jira-style project flow on GitHub, distributed as the official Go-built gira binary."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "StatPan", email = "statpan@outlook.com" }
]
keywords = [
  "github",
  "jira",
  "cli",
  "project-management",
  "issues",
  "pull-requests",
  "workflow",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/StatPan/gira#readme"
Repository = "https://github.com/StatPan/gira"
Issues = "https://github.com/StatPan/gira/issues"
Changelog = "https://github.com/StatPan/gira/blob/main/CHANGELOG.md"

[project.scripts]
gira = "gira_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
