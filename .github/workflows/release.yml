name: Go release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Check install script
        run: sh -n install.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run npm wrapper tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: npm test --prefix packages/npm

      - name: Set up Python
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Run PyPI wrapper tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: PYTHONPATH=packages/pypi/src python -m unittest discover -s packages/pypi/tests

      - name: Build PyPI wrapper package
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build packages/pypi
          python -m twine check packages/pypi/dist/*

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          commit="${GITHUB_SHA}"
          date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          name="gira_${version}_${GOOS}_${GOARCH}"
          out_dir="dist/${name}"
          bin="gira"
          if [ "${GOOS}" = "windows" ]; then
            bin="gira.exe"
          fi

          mkdir -p "${out_dir}" release-assets
          ldflags="-s -w -X github.com/StatPan/gira/internal/gira.Version=${version} -X github.com/StatPan/gira/internal/gira.Commit=${commit} -X github.com/StatPan/gira/internal/gira.Date=${date}"
          CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o "${out_dir}/${bin}" ./cmd/gira
          cp README.md "${out_dir}/"

          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist && zip -qr "../release-assets/${name}.zip" "${name}")
          else
            tar -C dist -czf "release-assets/${name}.tar.gz" "${name}"
          fi

      - name: Smoke install script against local archive
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          name="gira_${version}_${GOOS}_${GOARCH}"
          archive="${name}.tar.gz"
          asset_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          cp "release-assets/${archive}" "${asset_dir}/${archive}"
          (cd "${asset_dir}" && sha256sum "${archive}" > checksums.txt)
          GIRA_VERSION="${version}" GIRA_BASE_URL="file://${asset_dir}" GIRA_INSTALL_DIR="${install_dir}" sh install.sh
          "${install_dir}/gira" --help >/dev/null
          "${install_dir}/gira" version
          "${install_dir}/gira" version --json | grep "\"version\": \"${version}\""

          npm_project="$(mktemp -d)"
          (cd "${npm_project}" && npm init -y >/dev/null)
          (
            cd "${npm_project}"
            GIRA_VERSION="${version}" GIRA_BASE_URL="file://${asset_dir}" npm install "${GITHUB_WORKSPACE}/packages/npm"
            ./node_modules/.bin/gira version --json | grep "\"version\": \"${version}\""
          )

          py_project="$(mktemp -d)"
          python -m venv "${py_project}/venv"
          "${py_project}/venv/bin/python" -m pip install "${GITHUB_WORKSPACE}/packages/pypi"
          GIRA_VERSION="${version}" GIRA_BASE_URL="file://${asset_dir}" GIRA_PYPI_CACHE_DIR="${py_project}/cache" "${py_project}/venv/bin/gira" version --json | grep "\"version\": \"${version}\""

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gira-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksum asset
        run: |
          set -euo pipefail
          cd release-assets
          expected_assets=(
            "gira_${GITHUB_REF_NAME}_darwin_amd64.tar.gz"
            "gira_${GITHUB_REF_NAME}_darwin_arm64.tar.gz"
            "gira_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
            "gira_${GITHUB_REF_NAME}_linux_arm64.tar.gz"
            "gira_${GITHUB_REF_NAME}_windows_amd64.zip"
          )
          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done
          actual_count="$(find . -maxdepth 1 -type f ! -name checksums.txt | wc -l | tr -d ' ')"
          test "${actual_count}" = "5"
          sha256sum "${expected_assets[@]}" > checksums.txt
          sha256sum -c checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to replace immutable release assets" >&2
            exit 1
          fi
          gh release create "${tag}" release-assets/* --verify-tag --title "${tag}" --generate-notes

  npm:
    name: Publish npm wrapper
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check npm token
        id: npm-token
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "NPM_TOKEN is not configured; skipping npm publish"
          else
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.npm-token.outputs.publish == 'true'
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        if: steps.npm-token.outputs.publish == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test npm wrapper
        if: steps.npm-token.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd packages/npm
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm test
          npm pack --dry-run

      - name: Publish npm wrapper
        if: steps.npm-token.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/npm
          npm publish --access public

  pypi:
    name: Publish PyPI wrapper
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Check PyPI token
        id: pypi-token
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "PYPI_API_TOKEN is not configured; skipping PyPI publish"
          else
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Test PyPI wrapper
        run: PYTHONPATH=packages/pypi/src python -m unittest discover -s packages/pypi/tests

      - name: Build PyPI wrapper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/pypi/pyproject.toml")
          version = "${{ github.ref_name }}".removeprefix("v")
          text = path.read_text()
          path.write_text(text.replace('version = "0.0.0.dev0"', f'version = "{version}"'))
          PY
          python -m pip install --upgrade build twine
          python -m build packages/pypi
          python -m twine check packages/pypi/dist/*

      - name: Smoke PyPI wrapper package
        run: |
          set -euo pipefail
          py_project="$(mktemp -d)"
          python -m venv "${py_project}/venv"
          "${py_project}/venv/bin/python" -m pip install packages/pypi/dist/*.whl
          GIRA_BASE_URL="https://github.com/StatPan/gira/releases/download/${GITHUB_REF_NAME}" GIRA_PYPI_CACHE_DIR="${py_project}/cache" "${py_project}/venv/bin/gira" version --json | grep "\"version\": \"${GITHUB_REF_NAME}\""

      - name: Publish PyPI wrapper
        if: steps.pypi-token.outputs.publish == 'true'
        run: python -m twine upload packages/pypi/dist/* -u __token__ -p "${PYPI_API_TOKEN}"

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Check Homebrew tap token
        id: brew-token
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update"
          else
            echo "publish=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Check out tap
        if: steps.brew-token.outputs.publish == 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: StatPan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release checksums
        if: steps.brew-token.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --repo StatPan/gira --pattern checksums.txt --dir release-assets --clobber

      - name: Update formula
        if: steps.brew-token.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/StatPan/gira/releases/download/${tag}"
          checksums="release-assets/checksums.txt"
          mkdir -p homebrew-tap/Formula

          sha_for() {
            value="$(awk -v archive="$1" '$2 == archive || $2 == "*" archive { print $1 }' "${checksums}")"
            if [ -z "${value}" ]; then
              echo "missing checksum for $1" >&2
              exit 1
            fi
            printf '%s\n' "${value}"
          }

          darwin_arm64="gira_${tag}_darwin_arm64.tar.gz"
          darwin_amd64="gira_${tag}_darwin_amd64.tar.gz"
          linux_arm64="gira_${tag}_linux_arm64.tar.gz"
          linux_amd64="gira_${tag}_linux_amd64.tar.gz"

          cat > homebrew-tap/Formula/gira.rb <<EOF
          class Gira < Formula
            desc "Jira-style project flow on GitHub"
            homepage "https://github.com/StatPan/gira"
            version "${tag#v}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/${darwin_arm64}"
                sha256 "$(sha_for "${darwin_arm64}")"
              else
                url "${base}/${darwin_amd64}"
                sha256 "$(sha_for "${darwin_amd64}")"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base}/${linux_arm64}"
                sha256 "$(sha_for "${linux_arm64}")"
              else
                url "${base}/${linux_amd64}"
                sha256 "$(sha_for "${linux_amd64}")"
              end
            end

            def install
              bin.install Dir["gira_*/gira"].first => "gira"
            end

            test do
              assert_match "${tag}", shell_output("#{bin}/gira version")
            end
          end
          EOF
          ruby -c homebrew-tap/Formula/gira.rb

      - name: Commit formula
        if: steps.brew-token.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gira.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git commit -m "gira ${GITHUB_REF_NAME}"
          git push
