name: Go release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          name="gira_${version}_${GOOS}_${GOARCH}"
          out_dir="dist/${name}"
          bin="gira"
          if [ "${GOOS}" = "windows" ]; then
            bin="gira.exe"
          fi

          mkdir -p "${out_dir}" release-assets
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${out_dir}/${bin}" ./cmd/gira
          cp README.md "${out_dir}/"

          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist && zip -qr "../release-assets/${name}.zip" "${name}")
          else
            tar -C dist -czf "release-assets/${name}.tar.gz" "${name}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gira-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* --verify-tag --title "${tag}" --generate-notes
          fi
